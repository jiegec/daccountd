name: release
on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
    - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

permissions:
  contents: write

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true

    - name: Build
      run: |
        ./build.sh

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          daccountd-windows-amd64
          daccountd-darwin-amd64
          daccountd-linux-amd64
          daccountd-linux-arm64
          daccountd-linux-ppc64le
          daccountd-linux-mipsle
